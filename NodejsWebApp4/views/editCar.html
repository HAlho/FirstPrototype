<body>
    <section class="container profile-container">
        <div>
            <h1>Edit Car</h1>
            <hr /><br />
            <button id="makeCurrentCar" style="display:none;" onclick="makeCurrentCar()">Make Current Car</button>

            <p id="brand"><b>Brand</b></p>
            <p><br></p>

            <p id="model"><b>Model</b></p>
            <p><br></p>

            <p><b>License Plate Number</b></p>
            <input type="text" id="license" placeholder="Enter Your License Plate Number">
            <p><br></p>

            <p><b>Car Color</b></p>
            <select id="colors">
                <option value="Black" id="Black">Black</option>
                <option value="White" id="White">White</option>
                <option value="Silver" id="Silver">Silver</option>
                <option value="Grey" id="Grey">Grey</option>
                <option value="Gold" id="Gold">Gold</option>
                <option value="Red" id="Red">Red</option>
                <option value="Blue" id="Blue">Blue</option>
                <option value="Yellow" id="Yellow">Yellow</option>
                <option value="Green" id="Green">Green</option>
                <option value="Brown" id="Brown">Brown</option>
                <option value="Tan" id="Tan">Tan</option>
                <option value="Purple" id="Purple">Purple</option>
                <option value="Orange" id="Orange">Orange</option>
            </select>
            <p><br></p>

            <button onclick="submit()"><b>Submit</b></button>
            <button style="position: absolute; left: 0;" onclick="deleteCar()">Delete Car</button>


        </div>
    </section>
