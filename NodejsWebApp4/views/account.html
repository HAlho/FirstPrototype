<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Account</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style/profile.css">
</head>
<body>
    <section class="container profile-container">
        <div>
            <p><b>Account</b></p>
        </div>
        <div>
            <button id="modifyAccount">Modify Account</button>
            <button id="regCar">Register Your car</button>
            <button id="reqHistory">Requests History</button>
            <button id="logOut">Logout</button>
        </div>

    </section>

    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <!-- Insert these scripts at the bottom of the HTML, but before you use any Firebase services -->
    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>

    <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-analytics.js"></script>

    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-messaging.js"></script>


    <script>
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        var firebaseConfig = {
            apiKey: "AIzaSyCsxp_cLGjtePSDKH95MtD5XKg-iLXE8j4",
            authDomain: "auth-c0cb3.firebaseapp.com",
            databaseURL: "https://auth-c0cb3.firebaseio.com",
            projectId: "auth-c0cb3",
            storageBucket: "auth-c0cb3.appspot.com",
            messagingSenderId: "1034981325790",
            appId: "1:1034981325790:web:d5b3913ec1bd9c0137fb4f",
            measurementId: "G-1GCV52KFRG"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        firebase.analytics();
    </script>

    <script>
        const auth = firebase.auth();

        document.getElementById("logOut").addEventListener('click', () => {
            //signOut() is a built in firebase function responsible for signing a user out
            auth.signOut()
                .then(() => {
                    window.location.assign('../');
                })
                .catch(error => {
                    console.error(error);
                })
        })

        //Go to modification page
        document.getElementById("modifyAccount").addEventListener('click', () => {
            window.location.assign('../edit');
        });

        document.getElementById("reqHistory").addEventListener('click', () => {
            window.location.assign('../requestHistory');
        });

        document.getElementById("regCar").addEventListener('click', () => {
            window.location.assign('../registerCar');
        });


    </script>

</body>
</html>
