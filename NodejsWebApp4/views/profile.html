<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./style/profile.css">
    <link rel="stylesheet" href="./style/mainmenu.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    <section>
        <div class="pageName">HOME</div>
        <div class="currentCar" id="currentCar">
            <label><b id="currentCarInfo"></b></label>
            <i class="fa fa-pencil-square-o" style="font-size:20px;color:#2196f3; display:none;" id="edit"></i>
            <p id="noCar" style="display:none;">You don't have any registered cars</p>
            <br /><hr />
        </div>

        <div id="buttons">
            <button class="rectangle" id="showRequestForm"><b>Request Charge</b></button>
            <button class="rectangle disabled" id="avaReq">No Available Requests</button>
        </div>

        <div id="requestForm" style="display:none;">
            <b>----------- New Request -----------</b>
            <br /><br />
            <small><b>Current Energy Amount (kWh):</b></small>
            <small id="value"></small><br /><br />
            <small style="display: inline;">0</small>
            <div class="slidecontainer" id="slider" style="display:inline; margin: 0px 0px;"></div>
            <small id="max" style="display:inline;"></small>
            <br /><br /><br />

            <table>
                <tr>
                    <td>
                        <small><b>Request Charge by Amount (kWh):</b></small><br />
                        <input type="number" id="amount" name="amount" autocomplete="off"><br />
                    </td>
                    <td>
                        <label><small><b>pick a destination instead </b> </small></label>
                        <i class="fa fa-map-marker" style="font-size:24px;color:#ffd800" id="calculate" onclick="calculate()"></i>
                    </td>
                </tr>
            </table>

            <br /><br /><br />
            <table style="width: 100%">
                <tr>
                    <td><button class="rectangle1" id="cancelRequest"><b>Cancel</b></button></td>
                    <td><button class="rectangle1" id="SRequest"><b>Send Request</b></button></td>
                </tr>
            </table>

        </div>

        <div id="activeRequest">
            <div id="request" style="display:none;">
                <h2>Active Request</h2><br />
                <p id="requestText"></p><br />
                <div id="req"></div>
                <input type="text" id="paypal" value="" style="display:none;">
                <button id="cancel" style="display:none;"><b>Cancel</b></button>
                <button id="accept" style="display:none;"><b>Accept Request</b></button>
            </div>

            <div id="payment" style="display:none;">
                <button id="pay"><b>pay</b></button>
            </div>
        </div>
    </section>


    <div id="windowPromptAvaReq" class="windowPrompt" style="display:none;">
        <br />

        <p id="avaReqText"></p><br />
        <div id="avaReqDiv"></div>

        <input type="text" id="paypalAvaReq" value="">

        <button id="closeAvaReq" class="cancel" >Ignore</button>
        <button id="avaReqDecline" class="close">Decline</button>
        <button id="avaReqAccept">Accept</button>

    </div>

    <div class="mainMenu">
        <table>
            <tr>
                <td><button class="circle" id="status" onclick="openStatusMenu()"></button></td>
                <td><button class="circle active" id="home"><img src="./img/home.png" height="30"></button></td>
                <td><button class="circle" id="account"><img src="./img/account.png" height="30"></button></td>
            </tr>
            <tr>
                <td><small>STATUS</small></td>
                <td><small><b>HOME</b></small></td>
                <td><small>ACCOUNT</small></td>
            </tr>
        </table>
    </div>


    <div id="statusMenu" class="statusMenu tail">
        <a onclick="setStatus('Available')"><button class="statusCircle"><img src="./img/status-available.png" height="15px"></button>Available</a>
        <hr />
        <a onclick="setStatus('Do Not Disturb')"><button class="statusCircle" style="background-color:#DD5F56;"><img src="./img/status-busy.png" height="15px"></button>Busy</a>
    </div>


    <div id="dimContent" class="dimContent" onclick="closeStatusMenu()"></div>
