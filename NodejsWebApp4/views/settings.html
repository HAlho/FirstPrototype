                <tr>
                    <td style="width:100%;">Notifications</td>

    <script>
        // JavaScript source code
        firebase.auth().onAuthStateChanged(async function (user) {
            if (user) {
                updateSettings(); //check if user changed the browser's settings
                setSettings(); //set settings checkboxes
            } else window.location.assign('../');
        });

        function updateSettings() {
            if (Notification.permission === 'denied' || Notification.permission === 'default') localStorage.setItem('notificationsPermission', 'denied');
            else if (localStorage.getItem('notificationsPermission') == null) localStorage.setItem('notificationsPermission', Notification.permission);

            navigator.permissions.query({ name: 'geolocation' }).then(function (result) {
                if (result.state == 'prompt' || result.state == 'denied') localStorage.setItem('locationPermission', 'denied');
                else if (localStorage.getItem('locationPermission') == null) localStorage.setItem('locationPermission', result.state);
            });

            console.log("noti: " + localStorage.getItem('notificationsPermission'));
            console.log("loc: " + localStorage.getItem('locationPermission'));
        }

        function setSettings() {
            if (localStorage.getItem('notificationsPermission') == 'granted') document.getElementById("notifications").checked = true;
            else {
                localStorage.setItem('notificationsPermission', 'denied');
                document.getElementById("notifications").checked = false;
            }

            if (localStorage.getItem('locationPermission') == 'granted') document.getElementById("location").checked = true;
            else {
                localStorage.setItem('locationPermission', 'denied');
                document.getElementById("location").checked = false;
            }
        }

        document.getElementById("notifications").addEventListener('change', function () {
            if (this.checked) {
                notificationsPermission = Notification.permission;
                switch (notificationsPermission) {
                    case "denied":
                        document.getElementById("notifications").checked = false;
                        localStorage.setItem('notificationsPermission', 'denied');
                        alert("Notifications permission blocked. Please enable them in your browser.");
                        break;
                    case "default":
                        Notification.requestPermission().then(function (permission) {
                            // If the user accepts, let's create a notification
                            if (permission === "granted") {
                                var notification = new Notification("Hi there!");
                            }
                        });
                    case "granted":
                        localStorage.setItem('notificationsPermission', 'granted');
                }
            } else {
                localStorage.setItem('notificationsPermission', 'denied');
            }
        });

        document.getElementById("location").addEventListener('change', function () {
            if (this.checked) {
                navigator.geolocation.getCurrentPosition(async position => {
                    localStorage.setItem('locationPermission', 'granted');
                }, function () {
                        document.getElementById("location").checked = false;
                        localStorage.setItem('locationPermission', 'denied');
                        alert("Location permission blocked. Please enable them in your browser.");
                });
            } else {
                localStorage.setItem('locationPermission', 'denied');
            }
        });

        document.getElementById("deleteAccount").addEventListener('click', function () {
            var user = firebase.auth().currentUser; //current user
            var userId = user.uid; //current user id
            console.log("deleting..");

            deleteUser(userId);
            

        });

        async function deleteUser(userId) {
            const sdata = { userId };
            console.log(sdata);

            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(sdata)
            };
            const response = await fetch('/deleteUser', options);
            const json = await response.json();
            console.log(json);

            localStorage.removeItem('notificationsPermission');
            localStorage.removeItem('locationPermission');
            window.location.replace('../');

        }

    </script>

</body>
