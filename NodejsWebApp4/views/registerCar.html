    <a href="../viewCars" class="back">

        <small style="vertical-align:top; padding:5px 10px 0 0;">Save </small>

    <div class="carsContainer">

        <h3>Brand</h3>

        <select id="brands">
            <option>Select a Brand</option>
        </select>

        <h3>Model</h3>
        <select id="models" disabled class="custom-select">
            <option>Select a Model</option>
        </select>

        <h3>License Plate Number</h3>
        <input type="text" id="license" placeholder=" Enter Your License Plate Number">

        <h3>Car Color</h3>
        <select id="colors" class="custom-select">
            <option value="Black">Black</option>
            <option value="White">White</option>
            <option value="Silver">Silver</option>
            <option value="Grey">Grey</option>

            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Yellow">Yellow</option>
            <option value="Green">Green</option>
            <option value="Brown">Brown</option>
            <option value="Tan">Tan</option>
            <option value="Purple">Purple</option>
            <option value="Orange">Orange</option>
        </select>
    </div>
