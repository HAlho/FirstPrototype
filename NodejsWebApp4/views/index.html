    <section class="container">
        <h2>Welcome Back!</h2>
        <h6> Please enter your credentials to sign in</h6>
        <small id="alert"></small>

        <input type="email" id="mail" name="mail" placeholder="Email Address" required />

        <input type="password" id="password" name="password" placeholder="Password" required />
        <button class="rectangle-1" id="signInWithMail">Sign in</button>

        <a href="./reset"> forgot my password</a>
        <div class="clearfix"></div>


    </section>


    <div class="feedbackContainer success">
        <div class="feedbackIcon"></div>
        <p class="feedbackMessage">Signed up Successfully</p>
    </div>
    <div class="feedbackContainer failure">
        <div class="feedbackIcon"></div>
        <p class="feedbackMessage">Signing up failed</p>
    </div>
