<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Information</title>
    <link rel="stylesheet" href="./style/common.css">
    <script src="https://kit.fontawesome.com/c0551ed7d9.js" crossorigin="anonymous"></script>
    <style>
        table {
            margin: 30px auto;
            margin-top: 12px;
            line-height: 30px;
            padding-bottom: 9px;
            border-collapse: collapse;
            border-bottom: 1px solid #ddd;
            width: 85%;
            font-size: 16px;
            color: black;
        }
    </style>
</head>
<body>
    <!-- HTML elements -->
    <a href="../account" class="back">
        <i class="fas fa-chevron-left" style="color:black; font-size:0.6em; padding-bottom: 3px;"></i>
        <small style="vertical-align:top; padding-top:5px;"> Back</small>
    </a>
    <a id="addCard" class="next">
        <small style="vertical-align:top; padding-top:5px;">Add Card </small>
        <i class="fas fa-plus" style="color:#6dbec3; font-size:0.6em; padding-bottom: 3px;"></i>
    </a>
    <div class="pageName">Payment</div>

    <div id="payDiv" class="carsContainer">
        <small class="noInformation" style="display:none;" id="noInfo">Payment information was not added yet.</small>
    </div>

    <div id="dimContent" class="dimContent"></div>

    <div id="windowPromptPayment" class="windowPrompt">
        <p>Enter your Paypal email address</p>
        <small id="emailAlert"></small>
        <input type="text" id="emailInput">
        <button class="cancel" onclick="cancel()">cancel</button>
        <button onclick="saveCard()">ok</button>
    </div>
    <!-- Page ends here -->





    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <!-- Insert these scripts at the bottom of the HTML, but before you use any Firebase services -->
    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>

    <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-analytics.js"></script>

    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-messaging.js"></script>

    <!-- Firebase configuration -->
    <script src="./js/firebase-config.js"></script>






    <script>
        firebase.auth().onAuthStateChanged(async function (user) {
            if (user) { //if user is authenticated
                var userId = firebase.auth().currentUser.uid; //current user ID
                getCards(userId);

            } else window.location.assign('../mainpage'); //forward user to the welcome page
        });

        async function getCards(userId) {
            //get payment information from the server
            const sdata = { userId };
            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(sdata)
            };
            const response = await fetch('/getCards', options);
            const json = await response.json();
            cards = json.cards;

            //No info found
            if (cards == null) document.getElementById("noInfo").style.display = "block";
            else {
                var keys = Object.keys(cards); //get car ids
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    appendCard(cards[k], k);
                }
                document.getElementById("payDiv").lastElementChild.style.marginBottom = "200px";
            }
        }

        async function appendCard(card, cardId) {
            //create table to put request info in
            let cardTable = document.createElement('table');

            //td elements
            //create a td element to display card icon
            let cardIconTd = document.createElement('td');
            cardIconTd.style.width = '55px';
            cardIconTd.innerHTML = '<i class="far fa-credit-card" style="font-size:24px; padding:5px;vertical-align: bottom;">';

            //create a td element to display the email address
            let emailTd = document.createElement('td');
            let emailText = document.createTextNode(card.email);
            emailTd.appendChild(emailText);

            //create a td element to display trash icon
            let trashTd = document.createElement('td');
            trashTd.innerHTML = '<i class="fas fa-trash" style="color: #f08066;"></i>';

            trashTd.addEventListener('click', () => {
                deleteCard(cardId);
            });

            //tr elements
            //create row and append request date and an arrow
            let tr = document.createElement('tr');
            tr.appendChild(cardIconTd); tr.appendChild(emailTd); tr.appendChild(trashTd);

            cardTable.appendChild(tr);

            document.getElementById('payDiv').appendChild(cardTable);
        }

        async function deleteCard(cardId) {
            var userId = firebase.auth().currentUser.uid; //current user ID

            //send information to the server
            const cardData = { userId, cardId };
            const cardOptions = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(cardData)
            };
            const response = await fetch('/deleteCard', cardOptions);
            const jsonCard = await response.json();
            location.reload();
        }

        async function saveCard() {
            email = document.getElementById("emailInput").value;
            if (email != null && email != '' && validateEmail(email)) {
                var userId = firebase.auth().currentUser.uid; //current user ID

                //send information to the server
                const cardData = { userId, email };
                const cardOptions = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(cardData)
                };
                const response = await fetch('/savePaypal', cardOptions);
                const jsonCard = await response.json();
                location.reload();
            }
            cancel();
        }


        //function to validate email
        function validateEmail(email) {
            const alert = document.getElementById('emailAlert'); //to display error messages

            //check email length
            if (email.length > 320) { //email is too long
                alert.innerHTML = "Email is too long!"; //display error message
                return false;
            }

            //email format should follow something@something.something...
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/; //email regex. source: https://stackoverflow.com/questions/46155/how-to-validate-an-email-address-in-javascript
            if (!re.test(String(email).toLowerCase())) { //if email is not valid
                alert.innerHTML = 'Invalid email address!'; //display error message
                return false;
            }

            return true; //email is valid
        }
        //when any window prompt's cancel button is clicked
        function cancel() {
            var prompts = document.getElementsByClassName("windowPrompt"); //gete all window prompts
            for (var i = 0; i < prompts.length; i++) prompts[i].style.display = 'none'; //hide all window prompts
            document.getElementById("dimContent").classList.remove("dimVisible"); //brighten screen
            //clear any alerts
            document.getElementById('emailAlert').innerHTML = '';
        }

        document.getElementById('addCard').addEventListener('click', () => {
            document.getElementById("emailInput").value = '';

            //dim screen and show window prompt (id='windowPromptName')
            document.getElementById("dimContent").classList.add("dimVisible");
            setTimeout(function () { document.getElementById("windowPromptPayment").style.display = "block"; }, 250);
        });
    </script>


</body>
</html>
