<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sign In</title>
    <link rel="icon" href="./img/favicon.png">
    <link rel="stylesheet" href="./style/common.css">
    <link rel="stylesheet" href="./style/signin.css">
    <script src="https://kit.fontawesome.com/c0551ed7d9.js" crossorigin="anonymous"></script>
</head>
<body class="background">
    <!-- HTML elements -->
    <a href="../mainpage" class="back">
        <i class="fas fa-chevron-left" style="color:black; font-size:0.6em; padding-bottom: 3px;"></i>
        <small style="vertical-align:top; padding-top:5px;"> Back</small>
    </a>
    <section class="container">
        <h2>Welcome Back!</h2>
        <h6> Please enter your credentials to sign in</h6>
        <small id="alert" style="color:#f23c3c"></small>
        <div style="margin-bottom:20px;">
            <input type="email" id="mail" name="mail" placeholder="Email Address" required />
            <div style="margin:0;">
                <input type="password" id="password" name="password" placeholder="Password" style="margin-right: 0;" required />
                <i class="fas fa-eye" style="color: #5bbfc5; display:none; position: absolute; margin: 22px 0px 0 -37px; padding: 7px;" id="eye"></i>
                <i class="fas fa-eye-slash" style="color: #5bbfc5; display:none; position: absolute; margin: 22px 0px 0 -37px; padding: 7px;" id="eyeSlash"></i>
            </div>
        </div>

        <button class="rectangle-1" id="signin">Sign in</button>

        <p style="padding-top: 15px; font-size: 13px;"> Don't have an account? <a href="./signup" style="float:none;"> sign up </a></p>

        <a href="./reset"> forgot my password </a>
        <div class="clearfix"></div>
    </section>
    <!-- Page ends here -->
    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <!-- Insert these scripts at the bottom of the HTML, but before you use any Firebase services -->
    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>

    <!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-analytics.js"></script>

    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-database.js"></script>

    <!-- Firebase configuration -->
    <script src="./js/firebase-config.js"></script>





    <script>
        const emailField = document.getElementById('mail'); //email's input field
        const passwordField = document.getElementById('password'); //password's input field
        const eye = document.getElementById("eye");
        const eyeSlash = document.getElementById("eyeSlash");
        const alert = document.getElementById("alert"); //show any errors with signing in

        passwordField.addEventListener('input', () => {
            if (passwordField.value == '' || passwordField.value == null) {
                eye.style.display = "none";
                eyeSlash.style.display = "none";
            } else if (passwordField.type == 'password')
                eye.style.display = "inline-block";
            else eyeSlash.style.display = "inline-block";
        });

        eye.addEventListener('click', () => {
            passwordField.type = "text";
            eye.style.display = "none";
            eyeSlash.style.display = "inline-block";
        });

        eyeSlash.addEventListener('click', () => {
            passwordField.type = "password";
            eyeSlash.style.display = "none";
            eye.style.display = "inline-block";
        });
        //check if the user came back from the car select page
        window.addEventListener("pageshow", function (event) {
            var historyTraversal = event.persisted ||
                (typeof window.performance != "undefined" &&
                    window.performance.navigation.type === 2); // window.performance.navigation.type = 2 when user
            if (historyTraversal) window.location.assign('./home'); //forward user to main page
        });

        //check if user is already signed in
        firebase.auth().onAuthStateChanged(async function (user) {
            if (user) window.location.assign('./carSelect'); //if user is already signed in
        });

        //sign in button event listener. take user information and authenticate them
        document.getElementById('signin').addEventListener('click', () => {
            alert.innerHTML = '';
            const email = emailField.value; //get the user's input email
            const password = passwordField.value; //get the user's input password

            //check if the user left the email field empty
            if (email == '' || email == null) { //user did not input an email
                emailField.style.border = "1px solid red"; //make input field's borders red to alert user
                return;
            } else emailField.style.border = "none";

            //check if the user left the email field empty
            if (password == '' || password == null) { //user did not input a password
                passwordField.style.border = "1px solid red"; //make input field's borders red to alert user
                return;
            } else passwordField.style.border = "none";


            //built in firebase function responsible for authentication
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(() => { //signed in successfully
                    window.location.assign('./carSelect'); //forward user to carselect page
                })
                .catch(error => { //error signing in
                    console.error("error");
                    alert.innerHTML = "Incorrect email or password"; //display message
                });
        });
    </script>
</body>
</html>
